runtime: nodejs22

# Serve static frontend assets at https://hammertime-io.appspot.com with zero
# App Engine instances running ($0 compute cost). The browser client connects
# its WebSocket to the scale-to-zero Cloud Run backend.
handlers:
  - url: /
    static_files: index.html
    upload: index.html
    secure: always
    http_headers:
      Cache-Control: no-store, no-cache, must-revalidate

  - url: /index.html
    static_files: index.html
    upload: index.html
    secure: always
    http_headers:
      Cache-Control: no-store, no-cache, must-revalidate

  - url: /style.css
    static_files: style.css
    upload: style.css
    secure: always
    http_headers:
      Cache-Control: no-store, no-cache, must-revalidate

  - url: /dist/(.*\.(js|map))
    static_files: dist/\1
    upload: dist/.*\.(js|map)
    secure: always
    http_headers:
      Cache-Control: no-store, no-cache, must-revalidate

  - url: /(.*\.mp3)
    static_files: \1
    upload: .*\.mp3
    secure: always
